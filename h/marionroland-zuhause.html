<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--grund:#f4efe7;--text:#2f2a24;--leise:#776c60;--akzent:#7a4a2a;--karte:#fff;--display:"Young Serif",Georgia,serif;--sans:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--grund);color:var(--text);font-family:var(--sans);padding:0 16px 30px;display:flex;justify-content:center}
main{width:100%;max-width:520px}h1{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,7vw,2.5rem);text-align:center;margin:26px 0 4px}

.knopf{display:flex;align-items:center;gap:14px;background:var(--karte);color:var(--text);text-decoration:none;border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 4px rgba(40,30,20,.08)}
.knopf b{display:block;font-weight:600}.knopf small{color:var(--leise)}.knopf span.i{font-size:1.7rem;width:2rem;text-align:center}
.seit{background:var(--akzent);color:#fff;border-radius:14px;padding:14px 16px;margin:14px 0;text-align:center}.seit b{font-family:var(--display);font-weight:400;font-size:1.6rem;display:block}
.klein{font-size:.75rem;color:var(--leise);text-align:center;margin-top:22px}
</style></head><body><main>

<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>Linas Schneeflocke</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&display=swap">
<style>
/* Ein einziger Winterabend: tiefes Nachtblau, Eisweiß, ein warmes Kerzenlicht als Akzent. Bühne oben, Gruß darunter. */
:root{
  --nacht:#0d1a2e; --nacht2:#16294a; --eis:#eef4fb; --frost:#9fb8d6; --kerze:#f2b45a;
  --display:"Young Serif", Georgia, "Times New Roman", serif;
  --text:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%, var(--nacht2), var(--nacht) 70%);background-color:var(--nacht);color:var(--eis);font-family:var(--text);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;min-height:100%}
.buehne{width:100%;max-width:520px;aspect-ratio:1/1;position:relative;margin-top:12px}
canvas{width:100%;height:100%;display:block}
.gruss{max-width:30rem;text-align:center;display:flex;flex-direction:column;gap:10px;padding-block:4px 32px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,7vw,2.8rem);line-height:1.1;margin:0;text-wrap:balance}
h1 span{color:var(--kerze)}
p{margin:0;color:var(--frost);font-size:1.02rem;line-height:1.55}
.knoepfe{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
button{font:600 1rem var(--text);border-radius:999px;padding:12px 20px;cursor:pointer;border:1px solid var(--frost);background:transparent;color:var(--eis)}
button.haupt{background:var(--kerze);border-color:var(--kerze);color:var(--nacht)}
button:focus-visible{outline:3px solid var(--eis);outline-offset:3px}
.klein{font-size:.82rem;color:var(--frost);opacity:.8;margin-top:14px;letter-spacing:.04em}
</style>

<div class="buehne"><canvas id="c" aria-label="Animation: die Buchstaben des Namens werden zu einer Schneeflocke"></canvas></div>
<div class="gruss">
  <h1>Frohe Weihnachten, <span>Lina</span>!</h1>
  <p>Diese Schneeflocke ist aus deinem Namen gewachsen. Es gibt sie auf der ganzen Welt nur ein einziges Mal – und sie hat sogar ihre eigene Melodie.</p>
  <div class="knoepfe">
    <button class="haupt" id="spielen" type="button">♪ Deine Melodie hören</button>
    <button id="nochmal" type="button">Nochmal ansehen</button>
  </div>
  <div class="klein">Handgemacht von FromDyzamora</div>
</div>

76, "dauer": 2}, {"stufe": 6, "midi": 86, "dauer": 1}, {"stufe": 5, "midi": 84, "dauer": 3}], "tempo": 0.42};
const cv = document.getElementById('c'), cx = cv.getContext('2d');
const ruhig = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W = 0, H = 0, dpr = 1;
function groesse(){ dpr = Math.min(2, devicePixelRatio || 1); const r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W*dpr; cv.height = H*dpr; }
addEventListener('resize', groesse); groesse();
const flocke = new Path2D(D.flocke), schrift = new Path2D(D.text);
const flocken = Array.from({length: 70}, () => ({x: Math.random(), y: Math.random(), r: .6 + Math.random()*1.8, v: .02 + Math.random()*.05, p: Math.random()*6}));
const buchst = [...D.name];
let start = performance.now();
const ease = t => t<0?0:t>1?1:1-Math.pow(1-t,3);

function zeichne(jetzt){
  const t = ruhig ? 99 : (jetzt - start) / 1000;
  cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,W,H);
  // Schneefall
  for (const f of flocken){ f.y += f.v/60; if (f.y > 1.02) { f.y = -.02; f.x = Math.random(); }
    const x = (f.x + Math.sin(jetzt/1500 + f.p)*.01) * W; cx.fillStyle = 'rgba(238,244,251,.55)'; cx.beginPath(); cx.arc(x, f.y*H, f.r, 0, 7); cx.fill(); }
  const m = Math.min(W,H), mx = W/2, my = H/2, gross = m*.82;
  // 1) Buchstaben fliegen herein (0–2,2 s) und kreisen zur Mitte (2,2–3,2 s)
  if (t < 3.4){
    const n = buchst.length;
    buchst.forEach((b,i) => {
      const w0 = i/n*Math.PI*2 - Math.PI/2, ein = ease((t - i*.25)/1.6), rein = ease((t-2.2)/1.0);
      const r = (1-ein)*m*.9 + ein*m*.32*(1-rein);
      const w = w0 + rein*2.2 + (1-ein)*1.5;
      cx.save(); cx.globalAlpha = Math.min(1, ein*1.5) * (1 - rein*.9);
      cx.translate(mx + Math.cos(w)*r, my + Math.sin(w)*r); cx.rotate((1-ein)*3);
      cx.font = `${m*.12}px "Young Serif", Georgia, serif`; cx.textAlign='center'; cx.textBaseline='middle';
      cx.shadowColor = 'rgba(242,180,90,.8)'; cx.shadowBlur = 18; cx.fillStyle = '#eef4fb'; cx.fillText(b.toUpperCase(),0,0); cx.restore();
    });
  }
  // 2) Die Flocke wächst aus der Mitte (ab 3 s)
  const g = ruhig ? 1 : ease((t-3.0)/2.2);
  if (g > 0){
    cx.save(); cx.translate(mx,my); cx.rotate((1-g)*-1.2 + Math.sin(jetzt/4000)*.03);
    cx.beginPath(); cx.arc(0,0, g*gross*.75, 0, 7); cx.clip();
    cx.scale(gross, gross);
    cx.shadowColor = 'rgba(159,184,214,.9)'; cx.shadowBlur = 30;
    cx.fillStyle = '#eef4fb'; cx.fill(flocke, 'evenodd');
    cx.shadowBlur = 0; cx.globalAlpha = ease((t-4.6)/1.0) || (ruhig?1:0);
    cx.fillStyle = '#16294a'; cx.fill(schrift, 'evenodd');
    cx.restore();
    // Funkeln
    if (g > .98){ for (let k=0;k<6;k++){ const a = k*Math.PI/3 - Math.PI/2 + jetzt/3000, s = (Math.sin(jetzt/300 + k)+1)/2;
      cx.fillStyle = `rgba(242,180,90,${.25+.5*s})`; cx.beginPath(); cx.arc(mx+Math.cos(a)*gross*.47, my+Math.sin(a)*gross*.47, 1.5+2*s, 0, 7); cx.fill(); } }
  }
  requestAnimationFrame(zeichne);
}
requestAnimationFrame(zeichne);

// Spieldose: Namens-Melodie mit Web Audio
let ac;
function spiele(){
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  const t0 = ac.currentTime + .1, haupt = ac.createGain(); haupt.gain.value = .35; haupt.connect(ac.destination);
  const ton = (midi, zeit, laut) => { const f = 440*Math.pow(2,(midi-69)/12);
    [[1,1,2.2],[2,.45,4.5],[3.01,.22,7],[5.43,.12,12]].forEach(([m,a,d]) => { const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f*m; g.gain.setValueAtTime(0, zeit); g.gain.linearRampToValueAtTime(a*laut, zeit+.004); g.gain.exponentialRampToValueAtTime(.0001, zeit+2.2/d*3);
      o.connect(g); g.connect(haupt); o.start(zeit); o.stop(zeit + 3); }); };
  let z = t0; D.noten.forEach(n => { ton(n.midi, z, .6); z += n.dauer*D.tempo; });
  [[0,7],[5,9],[7,11],[0,4],[0,7]].forEach((b,k) => b.forEach((s,j) => ton(60+s, t0 + (k*3 + j*1.5)*D.tempo, .22)));
}
document.getElementById('spielen').onclick = () => { start = performance.now() - 2000; spiele(); };
document.getElementById('nochmal').onclick = () => { start = performance.now(); };

<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Ein Brief für Lina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&family=Caveat:wght@500&display=swap">
<style>
/* Briefpapier auf dunklem Holztisch: Umschlag mit Siegel, darunter der Countdown in Tagen */
:root{--tisch:#2b1d14;--tisch2:#3d2a1d;--papier:#f6eedc;--tinte:#2f2a4a;--siegel:#a3262c;--gold:#d9a85b;--leise:#c9b79b;
 --display:"Young Serif",Georgia,serif;--text:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;--hand:"Caveat","Segoe Print","Bradley Hand",cursive;color-scheme:dark}
html,body{min-height:100%}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--tisch2),var(--tisch) 70%);background-color:var(--tisch);color:var(--papier);font-family:var(--text);
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center}
.umschlag{position:relative;width:min(100%,420px);aspect-ratio:1.55;margin-top:40px;background:var(--papier);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.umschlag::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.6%,rgba(0,0,0,.08) 50%,transparent 50.4%),linear-gradient(to bottom left,transparent 49.6%,rgba(0,0,0,.08) 50%,transparent 50.4%);border-radius:6px}
.klappe{position:absolute;left:0;right:0;top:0;height:58%;background:#efe4cc;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1.4s ease;border-radius:6px 6px 0 0}
.offen .klappe{transform:rotateX(180deg)}
.siegel{position:absolute;left:50%;top:58%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c9454b,var(--siegel) 60%,#6e1418);
 display:grid;place-items:center;color:#f3c9c9;font:400 26px var(--display);box-shadow:0 3px 6px rgba(0,0,0,.35);transition:opacity .6s}
.offen .siegel{opacity:0}
.an{position:absolute;left:0;right:0;bottom:12%;text-align:center;font:500 2rem var(--hand);color:var(--tinte)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,6.5vw,2.3rem);text-align:center;margin:30px 0 4px;text-wrap:balance}
.unter{color:var(--leise);text-align:center;margin:0}
.zaehler{display:flex;gap:12px;margin:22px 0 6px}
.zaehler div{background:rgba(246,238,220,.08);border:1px solid rgba(217,168,91,.35);border-radius:10px;padding:10px 12px;min-width:64px;text-align:center}
.zaehler b{display:block;font:600 1.7rem var(--text);font-variant-numeric:tabular-nums;color:var(--gold)}
.zaehler span{font-size:.75rem;color:var(--leise);letter-spacing:.06em;text-transform:uppercase}
.brief{width:min(100%,520px);background:var(--papier);color:var(--tinte);border-radius:4px;padding:28px 26px 34px;margin:26px 0;box-shadow:0 18px 40px rgba(0,0,0,.45);
 font:500 1.55rem/1.45 var(--hand);white-space:pre-wrap;box-sizing:border-box}
.brief .gruss{text-align:right;margin-top:18px}
.klein{font-size:.82rem;color:var(--leise);opacity:.8;margin:20px 0 34px;letter-spacing:.04em;text-align:center}
</style></head><body>
<div class="umschlag" id="umschlag"><div class="klappe"></div><div class="siegel">♥</div><div class="an">für Lina</div></div>
<h1 id="titel">Ein Brief von deiner Oma Hilde</h1>
<p class="unter" id="unter">zum 18. Geburtstag · öffnet sich am 30. Oktober 2026</p>
<div class="zaehler" id="zaehler"><div><b id="t">–</b><span>Tage</span></div><div><b id="h">–</b><span>Stunden</span></div><div><b id="m">–</b><span>Minuten</span></div></div>
<div class="brief" id="brief" hidden></div>
<div class="klein">Ein Brief an die Zukunft · handgemacht von FromDyzamora</div>
<script src="zs.js"></script>
<script>
const B={"fuer": "Lina", "ziel": 1793373892702, "unter_offen": "zum 18. Geburtstag · geöffnet am 30. Oktober 2026", "inhalt": "-----BEGIN AGE ENCRYPTED FILE-----\nYWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IHRsb2NrIDMzNTIzNTA5IDUyZGI5YmE3\nMGUwY2MwZjZlYWY3ODAzZGQwNzQ0N2ExZjU0Nzc3MzVmZDNmNjYxNzkyYmE5NDYw\nMGM4NGU5NzEKa1lOZHRja2JYdThzYkMreHQvbFlyc25jbC9wQytnRnVINFlWMjh6\ncVE2NndRUmU1WUxmcHh0aHozWnVtV20vUQpEYkxBell0bThIYmNGR09iYnM5K2VD\nb0swdkorTE5lVHlFMUNrR3NhdW1PSTA0bFNhdlhqQVUwZ3lIUHF1dVJLCnRxMG9W\naXRvd2dGUU9YOHhibTl4a0d5OUpSc3YzSlllWXJqR1hvYmFiMHMKLS0tIC9RRmdX\nNTFKYWJvRHBqUGFrNWF1TGdRSTFlRWpVUVdiK1lVZ3gybHlUQ1EK9PhcHvLq6HEF\njbcvmra6OCQvWKAF09uRUoK2UC25kQu8dMouKge30uGooSgncXRxVZ2WhaRVwbcI\n6Ghx6gXOkuyklBefYQ7lw/KDB7hXXga5jPinJ7HTp2lGwcfSYO9OImUM3Y6BGDbJ\nprBDrr+6kIF2aP8+nRvrNhYqtI3hiqv7beOYK6q7vwIMGE0U8tHw8DC+ZHkTIwY1\n2RqDx9ZBsUx0jbvADj/H3HUzAF1/Gmno1ymYN6SogROwjgh4rMsHBQTNJZD65gH2\nvvEjVk+YfXX+k7rXWRTNBhnpKJc5c0K1tj7zhQmLGuHgTD/VD2rXp1I9hfSL9d8X\nX7fO0v8+BBAHiunvON8OGLCxbUtOQewWQJd1PavcjiUMectFxfuy96c33lGoE4CB\nxfqrR1eP8PAInxjKeRndmKffObU8kbGQ6L3u69CkaT+Y8X5xlmTKV/GWKMw0yYR7\n9oUD1jqLzBe1j1SdgCrhwa36lMj5O053W3gyfueFn2BuvoQ+fNyX8F871sRT96fv\nDw8mA8Jg39K3D4EYXSBm4WuIVFQUCHjvPD4+r8rMG1qIAvJEFmK7FGeeWJ1L+u9O\ndQ/kvNwvDFD8Mdaon3Ei4jnzvbn3lhViLfkDQ7kjfSOL16s=\n-----END AGE ENCRYPTED FILE-----\n"};
let versatz=0, oeffnet=false;
async function serverzeit(){try{const r=await fetch(location.href.split('#')[0].split('?')[0]+'?z='+Date.now(),{method:'HEAD',cache:'no-store'});const d=r.headers.get('date');if(d)versatz=new Date(d).getTime()-Date.now();}catch(e){}}
function zeige(text,gruss){const br=document.getElementById('brief');br.textContent=text;const g=document.createElement('div');g.className='gruss';g.textContent=gruss;br.appendChild(g);
 setTimeout(()=>{br.hidden=false;br.scrollIntoView({behavior:'smooth'});},1200);}
async function oeffnen(){
 if(oeffnet)return;oeffnet=true;
 document.getElementById('zaehler').hidden=true;
 const u=document.getElementById('unter');u.textContent='Das Siegel wird gebrochen …';
 try{const d=JSON.parse(await window.zeitschloss(B.inhalt));
  document.getElementById('umschlag').classList.add('offen');
  document.getElementById('titel').textContent='Dein Brief ist offen, '+B.fuer+'!';u.textContent=B.unter_offen;zeige(d.text,d.gruss);}
 catch(e){oeffnet=false;const frueh=/early|too soon/i.test(String(e));
  u.textContent=frueh?'Gleich ist es so weit – noch einen kleinen Moment …':'Der Brief lässt sich gerade nicht öffnen. Bitte versuch es später noch einmal.';
  setTimeout(oeffnen,frueh?20000:60000);}}
function tick(){
 if(oeffnet)return;
 const rest=B.ziel-(Date.now()+versatz);
 if(rest<=0){oeffnen();return;}
 const t=Math.floor(rest/864e5),h=Math.floor(rest%864e5/36e5),m=Math.floor(rest%36e5/6e4);
 document.getElementById('t').textContent=t.toLocaleString('de-DE');document.getElementById('h').textContent=h;document.getElementById('m').textContent=m;}
serverzeit().then(tick);setInterval(tick,20000);tick();
</script></body></html>

<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Linas Schneeflocken</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600&display=swap">
<style>
/* Winternacht wie bei der Geheimnis-Flocke; oben die neue Flocke groß, darunter die Sammlung als Reihe */
:root{--nacht:#0d1a2e;--nacht2:#16294a;--eis:#eef4fb;--frost:#9fb8d6;--kerze:#f2b45a;
 --display:"Young Serif",Georgia,serif;--text:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% 0%,var(--nacht2),var(--nacht) 70%);background-color:var(--nacht);color:var(--eis);font-family:var(--text);
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center}
.neu{width:100%;max-width:440px;aspect-ratio:1/1;margin-top:8px}
canvas{display:block;width:100%;height:100%}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,7vw,2.6rem);margin:0;text-align:center;text-wrap:balance}
h1 span{color:var(--kerze)}
p{color:var(--frost);text-align:center;max-width:30rem;line-height:1.55;margin:8px 0 0}
.reihe{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:26px 0 10px;max-width:560px}
.karte{width:96px;display:flex;flex-direction:column;align-items:center;gap:4px}
.karte canvas{width:96px;height:96px}
.karte b{font-weight:600;font-variant-numeric:tabular-nums}
.karte.leer canvas{opacity:.6}
.naechste{font-size:.92rem;margin:4px 0 0}
.klein{font-size:.82rem;color:var(--frost);opacity:.8;margin:18px 0 32px;letter-spacing:.04em}
</style></head><body>
